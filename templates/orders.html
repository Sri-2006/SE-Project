{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">KEEP THINGS MOVING</div><h1>Orders & shipments<span class="accent-dot">.</span></h1><p>Follow every replenishment from draft to delivery.</p></div><a href="{% url 'create_order' %}" class="button primary">+ Create order</a></div><section class="panel"><form method="get" class="filter-bar"><label for="order-status">Order status</label><select name="status" id="order-status"><option value="active" {% if state == 'active' %}selected{% endif %}>Active orders</option><option value="all" {% if state == 'all' %}selected{% endif %}>All orders</option>{% for value,label in statuses %}<option value="{{ value }}" {% if state == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="button secondary small">Apply</button></form>{% include 'partials/orders_table.html' %}{% include 'partials/pagination.html' with pagination=orders %}</section>{% endblock %}
